<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone Book</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Phone Book</h1>
        <div class="toolbar">
            <button id="addContactBtn">New Contact</button>
            <label>
                <input type="checkbox" id="showFavOnly"> Show Favorites Only
            </label>
            <input type="text" id="searchNameInput" placeholder="Search name..." class="search-input">
        </div>

        <!-- Create Contact Modal -->
        <div id="contactModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2>Create New Contact</h2>
                <div class="form-item">
                    <label>Name</label>
                    <input type="text" id="contactName" placeholder="Enter name">
                </div>
                <div class="form-item">
                    <label>Address</label>
                    <input type="text" id="contactAddress" placeholder="Enter address">
                </div>
                <div class="form-item">
                    <label>Phone Number</label>
                    <input type="text" id="initialPhone" placeholder="Enter phone number">
                </div>
                <div class="form-item">
                    <label>Email</label>
                    <input type="text" id="initialEmail" placeholder="Enter email">
                </div>
                <div class="form-item">
                    <label>QQ</label>
                    <input type="text" id="initialQQ" placeholder="Enter QQ">
                </div>
                <button id="saveContactBtn">Save Contact</button>
            </div>
        </div>

        <!-- Add Item Modal -->
        <div id="addItemModal" class="modal">
            <div class="modal-content">
                <span class="closeItem">&times;</span>
                <h2 id="itemModalTitle">Add New Item</h2>
                <div class="form-item">
                    <label id="itemInputLabel">Content</label>
                    <input type="text" id="newItemInput" placeholder="Enter content">
                </div>
                <button id="saveItemBtn">Add</button>
            </div>
        </div>

        <div id="contactList" class="contact-list">
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
